# Vercel instala las dependencias desde aquí (soporte nativo de Django).
# Mantener igual a requirements.txt, que usan CI y el desarrollo local.
[project]
name = "sonrisa-viva-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.16",
    "psycopg[binary]>=3.2",
    "dj-database-url>=2.3",
    "python-dotenv>=1.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.pruebas"
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
