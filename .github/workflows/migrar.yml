name: Migrar producción

# Se lanza a mano después de un cambio de modelos (o la primera vez, con datos de ejemplo).
# Usa el pooler de Supabase en modo sesión (puerto 5432): las migraciones no deben ir por
# el modo transacción.
on:
  workflow_dispatch:
    inputs:
      sembrar:
        description: "Regenerar los datos de ejemplo (borra los actuales)"
        type: boolean
        default: false

concurrency:
  group: base-de-produccion
  cancel-in-progress: false

jobs:
  migrar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.produccion
      DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRACIONES }}
      SEMILLA_ADMIN_PASSWORD: ${{ secrets.SEMILLA_ADMIN_PASSWORD }}
      # Obligatorias en producción pero sin efecto en estos comandos.
      SECRET_KEY: solo-para-comandos-de-gestion
      ALLOWED_HOSTS: localhost
      CSRF_TRUSTED_ORIGINS: https://sonrisa.marcovinir.dev
      FRONTEND_URL: https://sonrisa.marcovinir.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --noinput
      - run: python manage.py createcachetable
      - if: ${{ inputs.sembrar }}
        run: python manage.py sembrar --reiniciar
